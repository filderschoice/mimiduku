<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="t d">
  <title id="t">みみづくの仕組みの図解</title>
  <desc id="d">他のアプリの画面の文字と画面の切り替わりを端末の中で照合し、偽の警告や勝手な移動に気づいたらバッジと通知で知らせ、検知の記録を端末の中に残す流れ。外部への通信は行わない。</desc>
  <style>
    .box { fill: #ffffff; stroke: #1e3a5f; stroke-width: 2; }
    .own { fill: #fff4d6; stroke: #c77700; stroke-width: 2; }
    .t { font: 700 15px system-ui, "Noto Sans JP", "Yu Gothic UI", sans-serif; fill: #1e3a5f; text-anchor: middle; }
    .s { font: 12px system-ui, "Noto Sans JP", "Yu Gothic UI", sans-serif; fill: #4a5a70; text-anchor: middle; }
    .ar { stroke: #1e3a5f; stroke-width: 2.5; fill: none; marker-end: url(#h); }
    .no { stroke: #b3261e; stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
  </style>
  <defs><marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1e3a5f"/></marker></defs>
  <rect class="box" x="10" y="50" width="190" height="90" rx="14"/>
  <text class="t" x="105" y="85">他のアプリの画面</text>
  <text class="s" x="105" y="108">画面の文字・画面の切り替わり</text>
  <rect class="own" x="265" y="30" width="190" height="130" rx="14"/>
  <text class="t" x="360" y="62">みみづく（端末の中だけ）</text>
  <text class="s" x="360" y="88">ルールと照合</text>
  <text class="s" x="360" y="108">偽の警告の文言</text>
  <text class="s" x="360" y="128">タップなしの外部遷移</text>
  <rect class="box" x="520" y="20" width="190" height="60" rx="14"/>
  <text class="t" x="615" y="46">知らせる</text>
  <text class="s" x="615" y="66">バッジ・警告・通知</text>
  <rect class="box" x="520" y="110" width="190" height="60" rx="14"/>
  <text class="t" x="615" y="136">記録する</text>
  <text class="s" x="615" y="156">日時・アプリ名・種類だけ</text>
  <path class="ar" d="M200 95 H262"/>
  <path class="ar" d="M455 70 L518 55"/>
  <path class="ar" d="M455 120 L518 135"/>
  <path class="no" d="M360 160 V196"/>
  <text class="s" x="360" y="212">インターネットへは送らない（INTERNET 権限なし）</text>
</svg>
